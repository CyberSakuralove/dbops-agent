[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbops-agent"
version = "0.2.0"
description = "Cost-aware DBOps agent evaluation with independent approval and transactional remediation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["dbops_agent*", "scripts*"]

[tool.setuptools.package-data]
"dbops_agent.tasks" = ["seed.yaml"]
